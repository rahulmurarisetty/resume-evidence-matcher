name: Release

# Pushing a tag such as v1.0.0 runs CI, then builds the images and pushes them to
# the GitHub Container Registry:
#
#   ghcr.io/<owner>/resume-evidence-matcher-api:<tag>      exact matching
#   ghcr.io/<owner>/resume-evidence-matcher-api:<tag>-ml   with matching by meaning
#   ghcr.io/<owner>/resume-evidence-matcher-ui:<tag>
#
# and moves the latest tag of each to this release. It signs in with the
# workflow's own GITHUB_TOKEN, so no secret has to be set up.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Image names
        run: |
          # Registry paths must be lowercase; GitHub user names may not be.
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=ghcr.io/$owner/resume-evidence-matcher-api" >> "$GITHUB_ENV"
          echo "UI_IMAGE=ghcr.io/$owner/resume-evidence-matcher-ui" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.ref_name }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: API image with matching by meaning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: INSTALL_ML=true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.ref_name }}-ml
            ${{ env.API_IMAGE }}:latest-ml
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Screen image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:${{ github.ref_name }}
            ${{ env.UI_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
