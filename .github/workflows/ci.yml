name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t resume-evidence-matcher:ci .

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 resume-evidence-matcher:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/readyz
          curl -fsS -X POST http://localhost:8000/api/v1/analyses \
            -F resume=@samples/generated/jordan_example_data_engineer.pdf \
            -F job_description="<samples/jobs/data_engineer.txt" \
            -o /tmp/analysis.json
          # v0.2: the "5+ years" requirement is now checked against the role dates.
          # The default image has no ML packages, so matching stays exact.
          python3 -c "import json; r = json.load(open('/tmp/analysis.json'))['report']; assert r['coverage']['required']['direct'] == 5, r['coverage']; assert r['matching_mode'] == 'exact', r['pipeline_version']; assert r['profile']['total_years'] >= 7.5, r['profile']"

      - name: Check compose file
        run: docker compose config --quiet

      - name: Container logs
        if: always()
        run: docker logs app || true
