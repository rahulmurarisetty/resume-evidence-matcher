[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-evidence-matcher"
version = "1.0.1"
description = "Maps job-description requirements to evidence in a resume, shows gaps, and never invents experience."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Venkata Rahul Murarisetty" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.26,<2",  # 2.x adds onnxruntime and other packages this app does not use
    "python-docx>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    # Claude, only used when ANTHROPIC_API_KEY is set. Checked against 2.6: the 2.x SDK
    # uses httpx2 and has no temperature parameter.
    "anthropic>=2.6,<3",
    # v1.0: accounts, migrations and Postgres.
    "argon2-cffi>=23.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Matching by meaning. Not in the lock files: PyTorch comes from a platform-specific
# index (the CPU-only one in the Docker image), which a universal lock can't express.
ml = ["sentence-transformers>=3"]
# The Streamlit screen in ui/app.py. It talks to the API over HTTP.
ui = ["streamlit>=1.67", "httpx>=0.27"]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "llm/prompts/*.md", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Starlette 1.x nudges TestClient users toward a different HTTP client package.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Labeled evaluation data, never code. A held-out set may be dropped into evals/data/
# by someone else, and the linters must not open it.
extend-exclude = ["evals/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (File(...), Depends(...))

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^evals/data/"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "docx", "docx.*"]
ignore_missing_imports = true

# The evaluation (evals/) renders its files with tests/builders.py. Type-check the
# calls into it, but don't report the test helpers' own untyped library calls.
[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
follow_imports = "silent"
